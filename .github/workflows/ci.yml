# The template repo's OWN CI entrypoint (what runs on this repo, not what ships).
#
# It wraps the shared reusable-pipeline.yml — the same file generated projects get — but
# passes build_docker: false / publish_pypi: false because this repo is a Copier template,
# not an installable package (`tool.uv package = false` in pyproject.toml): there is no wheel
# or image to publish. It still bumps the version, cuts a GitHub release, and deploys docs.
# Two PyMaxQ-specific jobs are added on top: `enforce-sync` and `e2e-dogfood`.
name: CI/CD

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # Root configs (mkdocs.yaml, .pre-commit-config.yaml, .gitignore) are generated from the
  # template/ source of truth by `poe sync`. This job re-runs it and fails if the tree is
  # dirty — i.e. someone edited a root config by hand instead of the template, or forgot to
  # commit the regenerated output. See "Configuration Synchronization" in docs/developing.md.
  enforce-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Run sync and check for dirty tree
        run: |
          uv sync --all-extras --dev
          uv run poe sync
          # If git diff outputs anything, the tree is dirty and the command fails
          git diff --exit-code || {
            echo "::error::Template and root are out of sync! Please run 'uv run poe sync' locally and commit the changes."
            exit 1
          }

  core-pipeline:
    # A called workflow's jobs can never hold more permissions than the caller
    # job grants, so this caller must request the union of every permission the
    # nested jobs in reusable-pipeline.yml declare (bump/github-release need
    # contents: write; publish/deploy-docs need id-token: write; the image build
    # needs packages: write; deploy-docs needs pages: write).
    permissions:
      contents: write
      id-token: write
      packages: write
      pages: write
    uses: ./.github/workflows/reusable-pipeline.yml
    # `inherit` forwards this repo's secrets (e.g. RELEASE_TOKEN) to the called workflow;
    # safe here because both files live in this same repo. zizmor flags blanket inherit.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      build_docker: false
      publish_pypi: false

  # PyMaxQ-specific jobs
  e2e-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python 3.10-3.13
        run: uv python install 3.10 3.11 3.12 3.13
      - name: Generate a sample project from HEAD
        # --trust is required because copier.yml's `_tasks` copy shared files post-render;
        # the source must be an absolute path (not ".") or those `_tasks` `cp` commands
        # can't resolve `_src_path`.
        run: uvx copier copy --trust --defaults --data-file tests/answers.yml --vcs-ref HEAD "$(pwd)" ../sample
      - name: Sync, run full nox matrix, build docs, run entrypoint
        working-directory: ../sample
        run: |
          uv sync --all-extras --dev
          uv run poe test 4
          uv run poe export-test-artifacts
          uv run poe test-all
          uv run poe docs
          uv run python scripts/example.py
