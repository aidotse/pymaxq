name: CI/CD

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  enforce-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Run sync and check for dirty tree
        run: |
          uv sync --all-extras --dev
          uv run poe sync
          # If git diff outputs anything, the tree is dirty and the command fails
          git diff --exit-code || {
            echo "::error::Template and root are out of sync! Please run 'uv run poe sync' locally and commit the changes."
            exit 1
          }

  core-pipeline:
    uses: ./.github/workflows/reusable-pipeline.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      build_docker: false
      publish_pypi: false

  # PyMaxQ-specific jobs
  e2e-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python 3.10-3.13
        run: uv python install 3.10 3.11 3.12 3.13
      - name: Generate a sample project from HEAD
        # --trust is required because copier.yml's `_tasks` copy shared files post-render;
        # the source must be an absolute path (not ".") or those `_tasks` `cp` commands
        # can't resolve `_src_path`.
        run: uvx copier copy --trust --defaults --data-file tests/answers.yml --vcs-ref HEAD "$(pwd)" ../sample
      - name: Sync, run full nox matrix, build docs, run entrypoint
        working-directory: ../sample
        run: |
          uv sync --all-extras --dev
          uv run poe test 4
          uv run poe export-test-artifacts
          uv run poe test-all
          uv run poe docs
          uv run python scripts/example.py
