name: CI/CD

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core-pipeline:
    uses: ./.github/workflows/reusable-pipeline.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      build_docker: false
      publish_pypi: false

  # PyMaxQ-specific jobs
  e2e-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python 3.10-3.13
        run: uv python install 3.10 3.11 3.12 3.13
      - name: Generate a sample project from HEAD
        run: uvx copier copy --defaults --data-file tests/answers.yml --vcs-ref HEAD . ../sample
      - name: Sync, run full nox matrix, build docs, run entrypoint
        working-directory: ../sample
        run: |
          uv sync --all-extras --dev
          uv run poe test 4
          uv run poe export-test-artifacts
          uv run poe test-all
          uv run poe docs
          uv run python scripts/example.py
