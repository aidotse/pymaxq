# Dogfood: build THIS template's own documentation site and deploy it to GitHub Pages.
#
# The docs sources live under template/docs/ as Jinja templates, so they can't be built
# directly. Instead we generate a throwaway project FROM this template (using the repo's own
# GitHub identity), build that project's docs, and publish the result. This gives PyMaxQ a real
# documentation site AND doubles as an end-to-end integration test: every push proves the
# template still generates, tests, and builds.
#
# Actions are SHA-pinned (version in the comment, kept current by Renovate) for supply-chain safety.
# SETUP: enable Pages once under Settings -> Pages -> Source: "GitHub Actions".
name: Docs (dogfood)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Generate a project from this template (dogfood)
        # Pass context via env (not inline ${{ }}) to avoid template-injection into the script.
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESC: ${{ github.event.repository.description }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          name=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          uvx copier copy --defaults --vcs-ref HEAD \
            --data project_name="$name" \
            --data description="${REPO_DESC:-A max quality Python project}" \
            --data author="$owner" \
            --data email="noreply@github.com" \
            --data group="$owner" \
            --data ci_platform=github \
            . .dogfood-site
      - name: Build the documentation
        working-directory: .dogfood-site
        run: |
          uv sync --all-extras --dev
          uv run poe test 4
          uv run poe export-test-artifacts
          uv run poe docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .dogfood-site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy to GitHub Pages
      id-token: write    # OIDC for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
