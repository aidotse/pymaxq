# Build PyMaxQ's OWN documentation site (docs/ + mkdocs.yaml) and deploy it to GitHub Pages,
# using the same Material for MkDocs stack the template ships (dogfooding the docs pipeline).
#
# The "generate a project from this template and build ITS docs" integration check lives in
# ci.yml's e2e-dogfood job, so this workflow stays focused on publishing.
#
# Actions are SHA-pinned (version in the comment, kept current by Renovate) for supply-chain
# safety. SETUP: enable Pages once under Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Build the documentation site
        run: |
          uv sync
          uv run poe docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write   # OIDC for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
