# Copier configuration for the PyMaxQ project template.
# Docs: https://copier.readthedocs.io
#
# Generate a project from this template with:
#   uv tool install copier
#   copier copy --trust <this-repo-url> path/to/my-project
# (--trust is required: the post-generation _tasks below run shell commands.)
#
# Pull in future template improvements from inside a generated project with:
#   copier update

# --- Engine settings -------------------------------------------------------
# Templated content lives under template/; everything outside it (this file,
# the README, tests/) is for developing the template itself and is never copied.
_subdirectory: template
# Exclusions
_exclude:
  # Standard Copier exclusions...
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  # Dynamic CI platform exclusions!
  - "{% if ci_platform == 'gitlab' %}.github{% endif %}"
  - "{% if ci_platform == 'github' %}.gitlab-ci.yml{% endif %}"
  - "{% if ci_platform == 'github' %}docker/ci.base.Dockerfile{% endif %}"
# Only files ending in .jinja are rendered (suffix stripped); all others are
# copied verbatim. This keeps files containing literal `${{ }}` (e.g. future
# GitHub Actions workflows) safe from Jinja's `{{ }}` delimiters.
_templates_suffix: .jinja
# Records answers in the generated project so `copier update` works.
_answers_file: .copier-answers.yml

# Post-generation tasks
_tasks:
  # NB: use `_copier_conf.src_path` (the local template checkout — a temp clone
  # for VCS sources), NOT `_src_path` (the raw source arg, which is the remote
  # URL for a `copier copy <url>` and can't be `cp`'d from).
  - "cp '{{ _copier_conf.src_path }}/renovate.json' 'renovate.json'"
  - "cp '{{ _copier_conf.src_path }}/noxfile.py' 'noxfile.py'"
  - "cp '{{ _copier_conf.src_path }}/docs/user-guide.md' 'docs/user-guide.md'"
  - "mkdir -p .claude && cp '{{ _copier_conf.src_path }}/.claude/statusline.sh' '.claude/statusline.sh'"
  - "mkdir -p scripts && cp '{{ _copier_conf.src_path }}/scripts/bump.py' 'scripts/bump.py'"
  # Conditionally copy the reusable workflow
  - >-
    {% if ci_platform in ['github', 'both'] %}
    mkdir -p .github/workflows && cp '{{ _copier_conf.src_path }}/.github/workflows/reusable-pipeline.yml' '.github/workflows/reusable-pipeline.yml'
    {% endif %}

_message_after_copy: |
  Your project "{{ project_name }}" has been created.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    uv sync                      # create the virtualenv + install dependencies
    git init && git add -A       # start tracking the generated files
    uv run poe lint              # auto-format the freshly rendered files (re-run + re-add if it reports changes)
    git add -A
    git commit -m "feat: initial project scaffold"   # feat -> cuts your first release (v0.1.0), deploying docs on push
    uv run pre-commit install    # after the 1st commit: once installed, no-commit-to-branch blocks commits on main
    git checkout -b feat/initial-setup   # branch off: main is protected by no-commit-to-branch
  {% if ci_platform in ['github', 'both'] %}
  Before your first push, in your GitHub repo settings (details in the "Repository settings" docs):
    - Protect the default branch, and let CI push the release bump back to it: add a RELEASE_TOKEN
      secret (or grant github-actions[bot] a bypass) -- otherwise the release job cannot push.
    - Enable Pages: Settings > Pages > Source: "GitHub Actions" -- otherwise the docs-deploy job fails.
  {% endif %}
  {% if ci_platform in ['gitlab', 'both'] %}
  Before your first push, in your GitLab project settings (details in the "Repository settings" docs):
    - Add a CI_REPO_ACCESS token (Maintainer; read/write repository) and protect the default branch,
      so CI can push the release bump back to it -- otherwise the release job cannot push.
  {% endif %}
# --- Questions -------------------------------------------------------------
project_name:
  type: str
  help: Project name as a slug (lowercase, hyphens), e.g. my-awesome-project
  validator: >-
    {% if not project_name %}Project name is required.
    {% elif project_name != project_name | lower %}Use lowercase letters only (hyphens for spaces).
    {% elif ' ' in project_name %}No spaces — use hyphens, e.g. my-awesome-project.
    {% endif %}

package_name:
  type: str
  help: Importable Python package name (defaults to the slug with underscores)
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"
  validator: >-
    {% if not package_name %}Package name is required.
    {% elif package_name != package_name | lower %}Use lowercase letters only.
    {% elif '-' in package_name or ' ' in package_name %}Use underscores, not hyphens or spaces.
    {% endif %}

description:
  type: str
  help: One-line description of the project

author:
  type: str
  help: Author full name

email:
  type: str
  help: Author email address
  # Jinja2's SandboxedEnvironment (as configured by Copier) has no regex filter/test
  # built in, and adding one would require a `jinja_extensions:` entry (a Python
  # plugin) -- overkill for one field. This hand-rolled check enforces the same shape
  # as `^[^@\s]+@[^@\s]+\.[^@\s]+$` using plain string methods instead.
  validator: >-
    {% if not email %}Email is required.
    {% elif email.count('@') != 1 %}Enter a valid email address (must contain exactly one @).
    {% elif ' ' in email %}Enter a valid email address (no spaces).
    {% elif email.split('@')[0] == '' %}Enter a valid email address (missing name before @).
    {% elif '.' not in email.split('@')[1] %}Enter a valid email address (missing domain, e.g. .com).
    {% elif email.split('@')[1].startswith('.') or email.split('@')[1].endswith('.') %}Enter a valid email address (invalid domain).
    {% endif %}

group:
  type: str
  help: Namespace the repo lives under — GitHub owner/org or GitLab group, e.g. dev-tools

ci_platform:
  type: str
  help: Which CI/CD platform(s) to generate pipelines for
  choices:
    GitLab: gitlab
    GitHub: github
    Both (mirror to both): both
  default: github
  # The GitHub release workflow chooses its publish target at runtime via the
  # PUBLISH_TARGET repo variable (PyPI OIDC by default, or a private index).

gitlab_host:
  type: str
  help: GitLab instance host — self-hosted host or gitlab.com (only used for GitLab-only projects)
  default: gitlab.com
  when: "{{ ci_platform == 'gitlab' }}"

# --- Computed (not prompted): repo + docs base URLs, branched on the CI platform -------
# `group` is the GitHub owner/org OR the GitLab group. GitHub is the primary host: for 'both'
# the canonical repo/docs URLs point to GitHub (the GitLab pipeline still runs as a mirror).
# Only a gitlab-only generation uses the internal GitLab/Pages hosts.
repo_url:
  type: str
  when: false
  default: "{% if ci_platform in ['github', 'both'] %}https://github.com/{{ group }}/{{ project_name }}{% else %}https://{{ gitlab_host }}/{{ group }}/{{ project_name }}{% endif %}"

docs_url:
  type: str
  when: false
  default: "{% if ci_platform in ['github', 'both'] %}https://{{ group }}.github.io/{{ project_name }}{% else %}{% if gitlab_host == 'gitlab.com' %}https://{{ group }}.gitlab.io/{{ project_name }}{% else %}https://{{ gitlab_host | replace('gitlab.', 'pages.') }}/{{ group }}/{{ project_name }}{% endif %}{% endif %}"
